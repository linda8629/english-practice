<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>每日測驗 - English Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page-id="quiz">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <a href="index.html" class="app-header__brand-mark" style="text-decoration:none;">EP</a>
        <span>每日測驗</span>
      </div>
    </header>

    <main class="app-main">
      <!-- Loading state -->
      <div id="loadingState" class="empty-state">
        <div class="empty-state__icon">⏳</div>
        <p>正在準備今天的題目...</p>
      </div>

      <!-- Quiz in progress -->
      <section id="quizView" class="stack" hidden>
        <div class="stack stack--tight">
          <div class="progress-bar">
            <div id="progressFill" class="progress-bar__fill" style="width: 0%;"></div>
          </div>
          <p class="text-muted" id="progressLabel" style="font-size: var(--text-sm);">第 1 / 10 題</p>
        </div>

        <div class="card">
          <p id="questionType" class="chip" style="margin-bottom: var(--space-3);"></p>
          <p id="questionStem" class="question-stem"></p>
          <div id="optionList" class="option-list"></div>
          <div id="explanation" class="explanation" hidden></div>
        </div>

        <button id="nextBtn" class="btn btn--primary" hidden>下一題</button>
      </section>

      <!-- Results -->
      <section id="resultView" class="stack" hidden>
        <div class="center-page" style="padding-top: 0;">
          <span class="chip chip--accent" id="resultBadge"></span>
          <h1 id="resultAccuracy"></h1>
          <p>本次測驗結果</p>
        </div>

        <div class="stat-grid">
          <div class="stat-tile">
            <div class="stat-tile__value" id="statCorrect">0</div>
            <div class="stat-tile__label">答對</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile__value" id="statWrong">0</div>
            <div class="stat-tile__label">答錯</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile__value" id="statTime">0s</div>
            <div class="stat-tile__label">花費時間</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile__value" id="statWeakest">-</div>
            <div class="stat-tile__label">最弱題型</div>
          </div>
        </div>

        <a class="btn btn--secondary" href="review.html">前往錯題本複習</a>
        <button id="retryBtn" class="btn btn--primary">再測一次</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="頁面導覽">
      <a class="bottom-nav__link" data-nav-id="home" href="index.html"><span class="bottom-nav__icon">🏠</span>首頁</a>
      <a class="bottom-nav__link" data-nav-id="quiz" href="quiz.html"><span class="bottom-nav__icon">📝</span>測驗</a>
      <a class="bottom-nav__link" data-nav-id="vocab" href="vocab.html"><span class="bottom-nav__icon">📚</span>單字</a>
      <a class="bottom-nav__link" data-nav-id="statistics" href="statistics.html"><span class="bottom-nav__icon">📊</span>統計</a>
      <a class="bottom-nav__link" data-nav-id="settings" href="settings.html"><span class="bottom-nav__icon">⚙️</span>設定</a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { quizManager } from './js/modules/quizManager.js';
    import { scoreManager } from './js/modules/scoreManager.js';
    import { QUIZ_CONFIG, STORAGE_KEYS, DEFAULT_SETTINGS } from './js/config.js';
    import { storage } from './js/storage.js';

    const loadingState = document.getElementById('loadingState');
    const quizView = document.getElementById('quizView');
    const resultView = document.getElementById('resultView');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const questionType = document.getElementById('questionType');
    const questionStem = document.getElementById('questionStem');
    const optionList = document.getElementById('optionList');
    const explanation = document.getElementById('explanation');
    const nextBtn = document.getElementById('nextBtn');
    const retryBtn = document.getElementById('retryBtn');

    const OPTION_LABELS = ['A', 'B', 'C', 'D'];
    const AUTO_ADVANCE_MS = 2200;

    let questions = [];
    let currentIndex = 0;
    let currentQuestionStartedAt = 0;
    let autoAdvanceTimer = null;

    /** Renders the question at `currentIndex`. */
    function renderQuestion() {
      const question = questions[currentIndex];
      currentQuestionStartedAt = Date.now();

      progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;
      progressLabel.textContent = `第 ${currentIndex + 1} / ${questions.length} 題`;
      questionType.textContent = question.type;
      questionStem.textContent = question.stem;
      explanation.hidden = true;
      nextBtn.hidden = true;

      optionList.innerHTML = '';
      question.options.forEach((option, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.optionId = option.id;
        btn.innerHTML = `<span class="option-btn__label">${OPTION_LABELS[i]}</span><span>${option.text}</span>`;
        btn.addEventListener('click', () => handleAnswer(option, btn));
        optionList.appendChild(btn);
      });
    }

    /** Handles the learner tapping an option. */
    function handleAnswer(selectedOption, selectedBtn) {
      const question = questions[currentIndex];
      const isCorrect = selectedOption.correct;
      const timeSpentMs = Date.now() - currentQuestionStartedAt;

      // Lock all options and reveal correctness.
      [...optionList.children].forEach((btn) => {
        btn.disabled = true;
        if (btn.dataset.optionId === question.correctOptionId) {
          btn.classList.add('is-correct');
        }
      });
      if (!isCorrect) selectedBtn.classList.add('is-wrong');

      explanation.textContent = question.explanation;
      explanation.hidden = false;
      nextBtn.hidden = false;

      scoreManager.recordAnswer({ question, selectedOptionId: selectedOption.id, isCorrect, timeSpentMs });

      autoAdvanceTimer = setTimeout(goToNext, AUTO_ADVANCE_MS);
    }

    /** Advances to the next question, or shows results if this was the last one. */
    function goToNext() {
      clearTimeout(autoAdvanceTimer);
      currentIndex += 1;
      if (currentIndex >= questions.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    /** Finalizes the session and renders the results screen. */
    function showResults() {
      const summary = scoreManager.finishSession();

      quizView.hidden = true;
      resultView.hidden = false;

      document.getElementById('resultAccuracy').textContent = `${summary.accuracy}%`;
      document.getElementById('statCorrect').textContent = summary.correct;
      document.getElementById('statWrong').textContent = summary.wrong;
      document.getElementById('statTime').textContent = `${Math.round(summary.durationMs / 1000)}s`;
      document.getElementById('statWeakest').textContent = summary.weakestType || '-';

      const badge = summary.accuracy >= 80 ? '🎉 表現優異！' : summary.accuracy >= 50 ? '💪 繼續加油！' : '📖 再多複習一下吧';
      document.getElementById('resultBadge').textContent = badge;
    }

    /** Loads a fresh quiz and starts the session. */
    async function startQuiz() {
      loadingState.hidden = false;
      quizView.hidden = true;
      resultView.hidden = true;

      const settings = storage.get(STORAGE_KEYS.SETTINGS, DEFAULT_SETTINGS);
      const count = settings.dailyQuestionCount || QUIZ_CONFIG.DEFAULT_QUESTION_COUNT;

      questions = await quizManager.buildQuiz(count);
      currentIndex = 0;
      scoreManager.startSession();

      loadingState.hidden = true;
      quizView.hidden = false;
      renderQuestion();
    }

    nextBtn.addEventListener('click', goToNext);
    retryBtn.addEventListener('click', startQuiz);

    startQuiz().catch((error) => {
      console.error(error);
      loadingState.innerHTML = '<div class="empty-state__icon">⚠️</div><p>題目載入失敗，請確認 data/words.json 是否存在。</p>';
    });
  </script>
</body>
</html>
