<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>錯題本 - English Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .mistake-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-3);
    }
    .mistake-item__delete {
      color: var(--color-danger);
      font-size: var(--text-lg);
      flex-shrink: 0;
    }
  </style>
</head>
<body data-page-id="review">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <a href="index.html" class="app-header__brand-mark" style="text-decoration:none;">EP</a>
        <span>錯題本</span>
      </div>
    </header>

    <main class="app-main">
      <div class="stack" id="mistakeList"></div>
    </main>

    <nav class="bottom-nav" aria-label="頁面導覽">
      <a class="bottom-nav__link" data-nav-id="home" href="index.html"><span class="bottom-nav__icon">🏠</span>首頁</a>
      <a class="bottom-nav__link" data-nav-id="quiz" href="quiz.html"><span class="bottom-nav__icon">📝</span>測驗</a>
      <a class="bottom-nav__link" data-nav-id="vocab" href="vocab.html"><span class="bottom-nav__icon">📚</span>單字</a>
      <a class="bottom-nav__link" data-nav-id="statistics" href="statistics.html"><span class="bottom-nav__icon">📊</span>統計</a>
      <a class="bottom-nav__link" data-nav-id="settings" href="settings.html"><span class="bottom-nav__icon">⚙️</span>設定</a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { reviewManager } from './js/modules/reviewManager.js';

    const mistakeList = document.getElementById('mistakeList');

    function render() {
      const mistakes = reviewManager.getAll();
      mistakeList.innerHTML = '';

      if (mistakes.length === 0) {
        mistakeList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">🎉</div>
            <p>目前沒有錯題，繼續保持！</p>
          </div>`;
        return;
      }

      mistakes.forEach((mistake, index) => {
        const item = document.createElement('div');
        item.className = 'card mistake-item';
        item.innerHTML = `
          <div>
            <span class="chip">${mistake.date}</span>
            <p style="margin-top: var(--space-2);">${mistake.stem}</p>
          </div>
          <button class="mistake-item__delete" aria-label="刪除">✕</button>
        `;
        item.querySelector('button').addEventListener('click', () => {
          reviewManager.removeAt(index);
          render();
        });
        mistakeList.appendChild(item);
      });
    }

    render();
  </script>
</body>
</html>
