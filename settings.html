<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>設定 - English Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 26px;
      background: var(--color-border);
      border-radius: 999px;
      transition: background-color var(--duration-fast) var(--ease-standard);
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: transform var(--duration-fast) var(--ease-standard);
    }
    .switch.is-on {
      background: var(--color-primary);
    }
    .switch.is-on::after {
      transform: translateX(18px);
    }
    .segmented {
      display: flex;
      background: var(--color-surface-alt);
      border-radius: var(--radius-sm);
      padding: 2px;
    }
    .segmented button {
      padding: var(--space-1) var(--space-3);
      border-radius: calc(var(--radius-sm) - 2px);
      font-size: var(--text-sm);
    }
    .segmented button.is-active {
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      font-weight: 600;
    }
    .number-stepper {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .number-stepper button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-surface-alt);
      font-size: var(--text-lg);
      line-height: 1;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      margin-bottom: var(--space-3);
    }
    .field label {
      font-size: var(--text-sm);
      color: var(--color-ink-muted);
    }
    .field input {
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
    }
    .sync-status {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--color-ink-muted);
      margin-bottom: var(--space-4);
    }
    .sync-status__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-border);
      flex-shrink: 0;
    }
    .sync-status__dot.is-on {
      background: var(--color-success);
    }
    .sync-actions {
      display: flex;
      gap: var(--space-2);
    }
    .sync-actions .btn {
      width: auto;
      flex: 1;
      padding: var(--space-3);
    }
  </style>
</head>
<body data-page-id="settings">
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <a href="index.html" class="app-header__brand-mark" style="text-decoration:none;">EP</a>
        <span>設定</span>
      </div>
    </header>

    <main class="app-main">
      <div class="stack">
        <div class="card">
          <div class="setting-row">
            <span>每日題數</span>
            <div class="number-stepper">
              <button id="decreaseCount" aria-label="減少">−</button>
              <span id="dailyCountValue" class="font-mono">10</span>
              <button id="increaseCount" aria-label="增加">+</button>
            </div>
          </div>

          <div class="setting-row">
            <span>字體大小</span>
            <div class="segmented" id="fontSizeSegmented">
              <button data-value="small">小</button>
              <button data-value="medium">中</button>
              <button data-value="large">大</button>
            </div>
          </div>

          <div class="setting-row">
            <span>深色模式</span>
            <button id="darkModeSwitch" class="switch" aria-label="切換深色模式"></button>
          </div>

          <div class="setting-row">
            <span>播放音效</span>
            <button id="soundSwitch" class="switch" aria-label="切換音效"></button>
          </div>

          <div class="setting-row">
            <span>顯示解析</span>
            <button id="explanationSwitch" class="switch" aria-label="切換解析顯示"></button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom: var(--space-3);">☁️ 雲端同步（Google Sheets）</h3>
          <p class="text-muted" style="font-size: var(--text-sm); margin-bottom: var(--space-4);">
            選填。設定後，每次測驗結果會自動備份到你自己的 Google Sheet；
            網址與金鑰只會存在這個瀏覽器裡，不會出現在原始碼中。
            <a href="#" id="setupGuideLink" style="color: var(--color-primary);">如何設定？</a>
          </p>

          <div class="sync-status">
            <span class="sync-status__dot" id="syncStatusDot"></span>
            <span id="syncStatusText">尚未設定</span>
          </div>

          <div class="setting-row" style="border-bottom: none; padding-top: 0;">
            <span>從雲端讀取單字（取代 words.json）</span>
            <button id="cloudWordsSwitch" class="switch" aria-label="切換雲端單字來源"></button>
          </div>

          <div class="field">
            <label for="webAppUrlInput">Apps Script Web App 網址</label>
            <input id="webAppUrlInput" type="text" placeholder="https://script.google.com/macros/s/xxx/exec" />
          </div>

          <div class="field">
            <label for="syncKeyInput">同步金鑰</label>
            <input id="syncKeyInput" type="password" placeholder="與 Apps Script 中設定的 SYNC_KEY 相同" />
          </div>

          <div class="sync-actions">
            <button id="saveSyncBtn" class="btn btn--primary">儲存設定</button>
            <button id="restoreSyncBtn" class="btn btn--secondary">從雲端還原</button>
          </div>
        </div>

        <button id="resetBtn" class="btn btn--secondary" style="color: var(--color-danger);">清除所有學習資料</button>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="頁面導覽">
      <a class="bottom-nav__link" data-nav-id="home" href="index.html"><span class="bottom-nav__icon">🏠</span>首頁</a>
      <a class="bottom-nav__link" data-nav-id="quiz" href="quiz.html"><span class="bottom-nav__icon">📝</span>測驗</a>
      <a class="bottom-nav__link" data-nav-id="vocab" href="vocab.html"><span class="bottom-nav__icon">📚</span>單字</a>
      <a class="bottom-nav__link" data-nav-id="statistics" href="statistics.html"><span class="bottom-nav__icon">📊</span>統計</a>
      <a class="bottom-nav__link" data-nav-id="settings" href="settings.html"><span class="bottom-nav__icon">⚙️</span>設定</a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { storage } from './js/storage.js';
    import { eventBus } from './js/eventBus.js';
    import { STORAGE_KEYS, DEFAULT_SETTINGS, EVENTS } from './js/config.js';
    import { clamp } from './js/utils.js';
    import { syncManager } from './js/modules/syncManager.js';
    import { wordManager } from './js/modules/wordManager.js';

    let settings = { ...DEFAULT_SETTINGS, ...storage.get(STORAGE_KEYS.SETTINGS, {}) };

    const dailyCountValue = document.getElementById('dailyCountValue');
    const fontSizeSegmented = document.getElementById('fontSizeSegmented');
    const darkModeSwitch = document.getElementById('darkModeSwitch');
    const soundSwitch = document.getElementById('soundSwitch');
    const explanationSwitch = document.getElementById('explanationSwitch');
    const resetBtn = document.getElementById('resetBtn');

    function persist() {
      storage.set(STORAGE_KEYS.SETTINGS, settings);
      eventBus.emit(EVENTS.SETTINGS_CHANGED, settings);
    }

    function render() {
      dailyCountValue.textContent = settings.dailyQuestionCount;

      [...fontSizeSegmented.children].forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.value === settings.fontSize);
      });

      darkModeSwitch.classList.toggle('is-on', settings.darkMode);
      soundSwitch.classList.toggle('is-on', settings.soundEnabled);
      explanationSwitch.classList.toggle('is-on', settings.showExplanation);
    }

    document.getElementById('decreaseCount').addEventListener('click', () => {
      settings.dailyQuestionCount = clamp(settings.dailyQuestionCount - 5, 5, 30);
      persist();
      render();
    });

    document.getElementById('increaseCount').addEventListener('click', () => {
      settings.dailyQuestionCount = clamp(settings.dailyQuestionCount + 5, 5, 30);
      persist();
      render();
    });

    fontSizeSegmented.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      settings.fontSize = btn.dataset.value;
      persist();
      render();
    });

    darkModeSwitch.addEventListener('click', () => {
      settings.darkMode = !settings.darkMode;
      persist();
      render();
    });

    soundSwitch.addEventListener('click', () => {
      settings.soundEnabled = !settings.soundEnabled;
      persist();
      render();
    });

    explanationSwitch.addEventListener('click', () => {
      settings.showExplanation = !settings.showExplanation;
      persist();
      render();
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('確定要清除所有學習資料嗎？此操作無法復原。')) {
        storage.clearAll();
        settings = { ...DEFAULT_SETTINGS };
        storage.runMigrations();
        persist();
        render();
      }
    });

    // ---- Cloud sync (Google Sheets) ----
    const webAppUrlInput = document.getElementById('webAppUrlInput');
    const syncKeyInput = document.getElementById('syncKeyInput');
    const saveSyncBtn = document.getElementById('saveSyncBtn');
    const restoreSyncBtn = document.getElementById('restoreSyncBtn');
    const syncStatusDot = document.getElementById('syncStatusDot');
    const syncStatusText = document.getElementById('syncStatusText');
    const setupGuideLink = document.getElementById('setupGuideLink');
    const cloudWordsSwitch = document.getElementById('cloudWordsSwitch');

    function renderSyncStatus() {
      const config = syncManager.getConfig();
      webAppUrlInput.value = config.webAppUrl;
      syncKeyInput.value = config.syncKey;

      const configured = syncManager.isConfigured();
      syncStatusDot.classList.toggle('is-on', configured);
      restoreSyncBtn.disabled = !configured;

      cloudWordsSwitch.classList.toggle('is-on', config.useCloudWords);
      cloudWordsSwitch.disabled = !configured;
      cloudWordsSwitch.style.opacity = configured ? '1' : '0.5';

      if (!configured) {
        syncStatusText.textContent = '尚未設定';
      } else if (config.lastSyncedAt) {
        const time = new Date(config.lastSyncedAt).toLocaleString('zh-TW');
        syncStatusText.textContent = `已設定・上次同步：${time}`;
      } else {
        syncStatusText.textContent = '已設定・尚未同步過';
      }
    }

    cloudWordsSwitch.addEventListener('click', () => {
      if (cloudWordsSwitch.disabled) return;
      const config = syncManager.getConfig();
      syncManager.saveConfig({ useCloudWords: !config.useCloudWords });
      wordManager.invalidateCache();
      renderSyncStatus();
    });

    saveSyncBtn.addEventListener('click', () => {
      syncManager.saveConfig({
        webAppUrl: webAppUrlInput.value.trim(),
        syncKey: syncKeyInput.value.trim(),
      });
      wordManager.invalidateCache();
      renderSyncStatus();
      alert('已儲存。下次測驗結束後會自動嘗試備份到你的 Google Sheet。');
    });

    restoreSyncBtn.addEventListener('click', async () => {
      restoreSyncBtn.disabled = true;
      restoreSyncBtn.textContent = '還原中...';

      const result = await syncManager.restoreFromCloud();

      restoreSyncBtn.textContent = '從雲端還原';
      renderSyncStatus();

      if (result.ok) {
        alert(`已從雲端還原 ${result.sessionCount} 筆測驗紀錄，錯題本與統計已更新。`);
      } else {
        alert(`還原失敗：${result.error}`);
      }
    });

    setupGuideLink.addEventListener('click', (e) => {
      e.preventDefault();
      alert(
        '設定步驟：\n' +
        '1. 開一個新的 Google Sheet\n' +
        '2. 上方選單「擴充功能」→「Apps Script」\n' +
        '3. 貼上專案 README 中的 Apps Script 範例程式碼，並自訂一組 SYNC_KEY\n' +
        '4. 點「部署」→「新增部署」→ 類型選「網頁應用程式」，存取權限設為「任何人」\n' +
        '5. 複製部署後的網址，貼到上方「Apps Script Web App 網址」\n' +
        '6. 金鑰欄位填入跟程式碼中相同的 SYNC_KEY\n' +
        '詳細教學請見專案 README.md 的「雲端同步」章節。'
      );
    });

    renderSyncStatus();
    render();
  </script>
</body>
</html>
